[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "broadlink-magic"
version = "0.1.0"
description = "Local LAN protocol for BroadLink Magic Home families"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
    { name = "BroadLink" },
]
maintainers = [
    { name = "BroadLink" },
]
keywords = ["broadlink", "magic-home", "rm-max", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=43",
]

[project.urls]
Homepage = "https://github.com/ibroadlink/broadlink-magic"
Source = "https://github.com/ibroadlink/broadlink-magic"
Issues = "https://github.com/ibroadlink/broadlink-magic/issues"
Changelog = "https://github.com/ibroadlink/broadlink-magic/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.5",
    "build",
]

[tool.setuptools.packages.find]
include = ["broadlink_magic*"]

[tool.setuptools.package-data]
broadlink_magic = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 90
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    # The timeout parameters are the protocol timeout, not a cancellation scope.
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
# The package __init__ re-exports the public API.
"broadlink_magic/__init__.py" = ["F401"]
# Tests fire helper tasks without keeping a reference on purpose.
"tests/*" = ["RUF006"]
